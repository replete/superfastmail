<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Super Fastmail options</title>
  <meta name="manifest.open_in_tab" content="true" />
  <style>
    body { font: 14px/1.45 Metropolis, system-ui, "Segoe UI", Roboto, Ubuntu, Cantarell, "Noto Sans", -apple-system, Arial, sans-serif;
      margin: 0; background: var(--bar); color: var(--fg); }
    main { max-width: 560px; margin: 0 auto; padding: 24px 16px 40px; }
    header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; color: var(--bar-fg); }
    header h1 { font-size: 20px; margin: 0; flex: 1; }
    .chip { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 12px; background: #ffffff1f; color: var(--bar-fg); }
    .chip.ok::before { content: "●"; color: var(--dot-push); margin-right: 6px; }
    section { background: var(--bg); border-radius: 10px; padding: 16px 18px; margin-bottom: 12px; }
    h2 { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 12px; }
    label { display: block; font-weight: 600; margin: 10px 0 4px; }
    .help { display: block; font-size: 12.5px; color: var(--muted); margin-top: 4px; }
    input[type="password"], input[type="number"] { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--card-border);
      border-radius: 6px; padding: 7px 9px; box-sizing: border-box; }
    input[type="password"] { width: 100%; min-width: 0; }
    input[type="number"] { width: 64px; padding: 5px 7px; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    .inline { display: flex; align-items: center; gap: 8px; margin: 8px 0 0; font-weight: 400; }
    .inline input[type="checkbox"] { margin: 0; accent-color: var(--accent); width: 16px; height: 16px; }
    .actions { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
    button { font: inherit; cursor: pointer; }
    .btn { border: 0; border-radius: 6px; padding: 7px 14px; background: var(--btn); color: var(--btn-fg); font-weight: 600; }
    .btn.primary { background: var(--accent); color: var(--accent-fg); }
    .status { font-size: 12.5px; color: var(--muted); }
    .acct { margin-bottom: 4px; }
    .acct .muted { color: var(--muted); }
    .field { display: flex; gap: 8px; }
    .field input { flex: 1; }
    .result { margin-top: 10px; padding: 10px 12px; border-radius: 8px; background: var(--hover); font-size: 13px; }
    .result.ok { border-left: 3px solid var(--dot-push); }
    .result.err { border-left: 3px solid var(--dot-error); }
    .result ul { margin: 6px 0 0; padding: 0; list-style: none; display: grid; gap: 2px; }
    .result .no { color: var(--muted); }
    .result ul.flush { margin: 0; }
    .help.lead { margin: 0 0 10px; }
    kbd { font: 600 12px/1 ui-monospace, Menlo, monospace; padding: 3px 6px; border-radius: 4px; background: var(--chip);
      border: 1px solid var(--card-border); margin-right: 4px; }
    a.ext { display: inline-block; margin-top: 10px; font-size: 13px; color: var(--accent); }
    .labelrow { display: flex; align-items: baseline; gap: 10px; }
    .labelrow a { font-size: 12.5px; color: var(--accent); white-space: nowrap; }
    .tag { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      padding: 1px 6px; border-radius: 4px; background: var(--chip); color: var(--fg); margin-left: 6px; vertical-align: 1px; }
    #davSection { margin-top: 6px; }
    section h3 { font-size: 13px; font-weight: 700; margin: 20px 0 4px; padding-top: 14px; border-top: 1px solid var(--border); }
    label em { font-style: normal; font-weight: 400; color: var(--muted); }
    .methods { display: grid; gap: 6px; }
    .method { border: 1px solid var(--card-border); border-radius: 8px; }
    .method > label { display: grid; grid-template-columns: 18px 22px 1fr; gap: 10px; align-items: start; margin: 0; padding: 10px 12px;
      font-weight: 400; cursor: pointer; border-radius: 8px; }
    .method > label:hover { background: var(--hover); }
    .method:has(input[name="lock"]:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .method:has(input[name="lock"]:disabled) { opacity: 0.55; }
    .method:has(input[name="lock"]:disabled) > label { cursor: default; }
    .method input[name="lock"] { margin: 2px 0 0; accent-color: var(--accent); }
    .method b { font-weight: 600; }
    .method small { display: block; color: var(--muted); font-size: 12.5px; }
    .method .act { padding: 0 12px 12px 72px; }
    .method .micon { display: grid; color: var(--icon); padding-top: 1px; }
    .method .micon svg { width: 20px; height: 20px; }
    .method:has(input[name="lock"]:checked) .micon { color: var(--accent); }
    .method .act .actions { margin-top: 8px; }
    .savebar { position: sticky; bottom: 0; display: flex; align-items: center; gap: 8px; margin: 14px -18px -16px;
      padding: 12px 18px; background: var(--bg); border-top: 1px solid var(--border); border-radius: 0 0 10px 10px; }
    .savebar .status { margin-right: auto; }
    .invalid { outline: 2px solid var(--dot-error); outline-offset: 2px; border-radius: 8px; }
    .btn:disabled { opacity: 0.5; cursor: default; }
    #connStatus { display: block; margin-top: 10px; }
    #connStatus:empty { display: none; }
    .method .act label { margin-top: 0; }
    .method .current { font-size: 11px; font-weight: 700; color: var(--accent); margin-left: 6px; text-transform: uppercase; letter-spacing: 0.03em; }
    .status.err { color: var(--dot-error); }
  </style>
</head>
<body>
  <main>
    <header>
      <img src="/icon/48.png" width="36" height="36" alt="">
      <h1>Super Fastmail</h1>
      <span id="state" class="chip"></span>
    </header>

    <section>
      <h2>Connection</h2>
      <div id="acct" class="acct" hidden></div>
      <div class="labelrow"><label for="token">API token</label>
        <a href="https://app.fastmail.com/settings/security/tokens" target="_blank" rel="noopener noreferrer">Create JMAP API token ↗</a></div>
      <div class="field">
        <input id="token" type="password" autocomplete="off" placeholder="fmu1-…">
        <button id="test" class="btn">Test connection</button>
      </div>
      <div id="result" class="result" hidden></div>
      <div id="davSection" hidden>
        <div class="labelrow"><label for="dav">Calendar/Files password <em>(optional)</em></label>
          <a href="https://app.fastmail.com/settings/security/apps/new" target="_blank" rel="noopener noreferrer">Create custom DAV app password ↗</a></div>
        <div class="field">
          <input id="dav" type="password" autocomplete="off" placeholder="xxxx xxxx xxxx xxxx">
          <button id="testDav" class="btn">Test</button>
        </div>
        <div id="davResult" class="result" hidden></div>
      </div>

      <h3>Lock</h3>
      <span class="help lead">How your Fastmail credentials are kept on this computer. While locked, Super Fastmail can't
        check for new mail.</span>
      <div id="methods" class="methods" role="radiogroup" aria-label="Lock">
        <div class="method" data-m="none">
          <label><input type="radio" name="lock" value="none">
            <span><b>Don't lock <em>(not recommended)</em></b><small>Never asks, but your credentials are stored unprotected
              in this browser profile: anyone who can use it can use your Fastmail account.</small></span></label>
        </div>
        <div class="method" data-m="passphrase">
          <label><input type="radio" name="lock" value="passphrase">
            <span><b>Password</b><small>Your credentials are encrypted with a password, which you enter once each time the
              browser starts.</small></span></label>
          <div class="act" hidden>
            <div class="grid2">
              <div><label for="pass">Password</label><input id="pass" type="password" autocomplete="new-password" placeholder="8+ characters"></div>
              <div><label for="pass2">Repeat it</label><input id="pass2" type="password" autocomplete="new-password"></div>
            </div>
          </div>
        </div>
        <div class="method" data-m="device">
          <label><input type="radio" name="lock" value="device">
            <span><b>Passkey</b><small id="deviceHelp">Confirm with a passkey once each time the browser starts. No password
              needed.</small></span></label>
          <div class="act" hidden>
            <button class="btn" data-replace>Replace passkey</button>
          </div>
        </div>
        <div class="method" data-m="security-key">
          <label><input type="radio" name="lock" value="security-key">
            <span><b>Security key</b><small>Touch your USB or NFC security key (e.g. YubiKey) once each time the browser
              starts. No password needed.</small></span></label>
          <div class="act" hidden>
            <button class="btn" data-replace>Replace security key</button>
          </div>
        </div>
      </div>
      <div id="connStatus" class="status"></div>
      <div id="saveBar" class="savebar" hidden>
        <span id="saveReason" class="status" aria-live="polite"></span>
        <button id="cancel" class="btn">Cancel</button>
        <button id="save" class="btn primary">Save</button>
      </div>
    </section>

    <section class="settings">
      <h2>About</h2>
      <div id="about"></div>
    </section>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
