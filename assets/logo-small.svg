    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c4a78"/>
      <stop offset="1" stop-color="#1b2b45"/>
    </linearGradient>
    <clipPath id="env"><rect x="18" y="28" width="92" height="72" rx="10"/></clipPath>
