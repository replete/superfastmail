<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Super Fastmail mark: navy tile, envelope with a two-tone geometric flap, speed streaks.
       Palette nods to Fastmail (navy, amber, blue) without copying their ring logo. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c4a78"/>
      <stop offset="1" stop-color="#1b2b45"/>
    </linearGradient>
    <clipPath id="env"><rect x="38" y="34" width="76" height="60" rx="9"/></clipPath>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#tile)"/>
  <rect x="5" y="5" width="118" height="118" rx="27" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
  <g stroke="#6ca8d2" stroke-width="7" stroke-linecap="round">
    <line x1="14" y1="50" x2="28" y2="50"/>
    <line x1="18" y1="64" x2="30" y2="64"/>
    <line x1="14" y1="78" x2="28" y2="78"/>
  </g>
  <rect x="38" y="34" width="76" height="60" rx="9" fill="#ffffff"/>
  <g clip-path="url(#env)">
    <path d="M38 34 H76 V72 Z" fill="#f5b81c"/>
    <path d="M76 34 H114 L76 72 Z" fill="#3d8fd9"/>
  </g>
</svg>
